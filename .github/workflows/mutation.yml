# Mutation testing, standalone and advisory. Split out of `gates.yml`
# (ADR-0038): the score is reported but never holds up delivery — the trunk
# stays protected by typecheck, tests, review and the deployment gates.
# Runs on pushes to main and on demand; pull requests are intentionally not
# triggered until the score is a gate again.
name: mutation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue, never cancel: a new push waits behind the running mutation run
  # instead of superseding it, so every main commit eventually gets its
  # score without two runs overlapping.
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the force-on-test-change guard below diffs against
          # the base commit, and the incremental cache is keyed per commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # Stryker runs on Node even though the tests it drives run on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # Best-effort cache of the previous incremental report. A miss simply
      # means a full run; Stryker reports "no incremental result file found".
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-main-
            stryker-incremental-
      # The command runner reports no test coverage, so incremental mode can
      # only see mutant changes, never test changes (ADR-0021): when test
      # files, dependencies or the Stryker config itself changed, force a
      # full run instead of reusing results the new tests might have killed.
      # No --incremental on the forced run: at this suite size Stryker 10
      # crashes serializing the full incremental report (RangeError: Invalid
      # string length in writeIncrementalReport) after every mutant passed.
      - name: Run mutation testing
        run: |
          if git diff --name-only HEAD~1 HEAD -- '*.test.ts' '*.test.tsx' package.json bun.lock stryker.config.json | grep -q .; then
            echo "Test, dependency or config changes detected; forcing a full mutation run."
            bunx stryker run --force
          else
            bun run test:mutation:incremental
          fi
      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7
