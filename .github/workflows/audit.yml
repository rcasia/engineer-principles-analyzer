# A dependency can turn vulnerable without a single line of this repository
# changing: the advisory is published after the commit that pinned it. The
# pre-commit hook and the `gates` job (.github/workflows/gates.yml) only run
# when package.json or bun.lock changes, so neither would ever see that. This
# workflow re-runs the same audit against main on a schedule to catch it.
name: audit

on:
  schedule:
    # Every Monday at 06:00 UTC. Failures notify whoever watches the repo -
    # see docs/adr/0011-dependency-vulnerability-audit-gate.md.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run audit
