# The gates that protect main. Everything here runs on every push and every
# pull request, and nothing is allowed to land red.
name: gates

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      # Pull requests: validate the range. Pushes: validate the head commit.
      - name: Lint commit messages
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose
          else
            bunx commitlint --last --verbose
          fi

  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      # Backstops the pre-commit hook (lefthook.yml) for commits made with
      # --no-verify and for pull requests from forks, where local hooks never
      # ran at all.
      - run: bun run audit

  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the force-on-test-change guard below diffs against
          # the base commit, and the incremental cache is keyed per commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # Stryker runs on Node even though the tests it drives run on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # Best-effort cache of the previous incremental report. A miss simply
      # means a full run; Stryker reports "no incremental result file found".
      # Pull requests restore the base branch's cache via the restore-keys
      # fallback, so only mutants affected by the diff are re-tested.
      - name: Restore Stryker incremental cache
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-main-
            stryker-incremental-
      # Fails the build below the break threshold in stryker.config.json.
      # The command runner reports no test coverage, so incremental mode can
      # only see mutant changes, never test changes (ADR-0021): when test
      # files, dependencies or the Stryker config itself changed, force a
      # full run instead of reusing results the new tests might have killed.
      - name: Run mutation testing
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE" HEAD -- '*.test.ts' '*.test.tsx' package.json bun.lock stryker.config.json | grep -q .; then
            echo "Test, dependency or config changes detected since $BASE; forcing a full mutation run."
            bunx stryker run --incremental --force
          else
            bun run test:mutation:incremental
          fi
      # Fork pull requests run with a read-only token, so saving is limited
      # to runs that can write back to this repository.
      - name: Save Stryker incremental cache
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7

  lambda-bundle:
    name: lambda bundle runs on node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build:lambda
      # Production runs Node while development runs Bun (ADR-0005). This keeps
      # that gap honest by invoking the real bundle the way Lambda would.
      - name: Smoke test the bundle
        run: node scripts/smoke-lambda.mjs

  cli-package:
    name: cli package installs from npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      # Packs the tarball npm would publish, installs it in a clean directory
      # with Node and runs the binary. Proves the package works for someone
      # without Bun, and that `files` ships nothing it should not.
      - run: bun scripts/check-cli-package.ts

  infra:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
      - run: bun install --frozen-lockfile
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      # LocalStack means the plan needs no AWS credentials, so this gate works
      # on a public repository with no secrets at all.
      - name: Start LocalStack
        run: bun run localstack:up
      - name: Apply against LocalStack
        run: bun run infra:apply:local
      - name: Check the deployed function serves the page
        run: bun scripts/check-deployed.ts
      - name: LocalStack logs
        if: failure()
        run: docker logs localstack --tail 200
      - name: Destroy
        if: always()
        run: bun run infra:destroy:local
