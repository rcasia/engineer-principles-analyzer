# LocalStack stands in for AWS so the Terraform in infra/ can be applied for
# real - locally and in CI - without an AWS account or any credentials.
#
#   docker compose -f infra/localstack/compose.yml up -d
#   bun run infra:apply:local
services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: "lambda,iam,logs,s3,sts"
      DEBUG: "0"
      LAMBDA_RUNTIME_EXECUTOR: "docker"
    volumes:
      # Lets LocalStack start Lambda containers on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
