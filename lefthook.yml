# Guardrails that run locally before code ever reaches main.
# The same checks run in CI (.github/workflows/) so the two cannot drift.

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    audit:
      glob:
        - "package.json"
        - "bun.lock"
      run: bun run audit
    secrets:
      # Requires Yelp detect-secrets, pinned to the baseline version:
      # pip install detect-secrets==1.5.0
      # Scans only staged changes; known test vectors live in
      # .secrets.baseline (see ADR-0027). Regenerate with:
      # detect-secrets scan --baseline .secrets.baseline > .secrets.baseline.new \
      #   && mv .secrets.baseline.new .secrets.baseline
      run: git diff --staged --name-only -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

pre-push:
  commands:
    test:
      run: bun test
