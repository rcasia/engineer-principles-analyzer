# Guardrails that run locally before code ever reaches main.
# The same checks run in CI (.github/workflows/) so the two cannot drift.

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    audit:
      glob:
        - "package.json"
        - "bun.lock"
      run: bun run audit

pre-push:
  commands:
    test:
      run: bun test
